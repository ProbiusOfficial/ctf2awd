name: 自动构建并推送 Docker 镜像到 GHCR (多文件夹)

on:
  push:
    # 监测 main 或 master 分支的推送
    branches: ["main", "master"]
    # 监测所有以 'v' 开头的标签（tag）
    tags:
      - "v*"
  # 允许手动从 GitHub 界面触发
  workflow_dispatch:

# 权限配置：读取代码、写入包（GHCR）
permissions:
  contents: read
  packages: write

# 通用环境变量
env:
  REGISTRY: ghcr.io
  # 基础镜像名称，例如 ProbiusOfficial/ctf2awd
  BASE_IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: 发现所有包含 Dockerfile 的子目录
  find_dirs:
    runs-on: ubuntu-latest
    outputs:
      # 现在输出 JSON 对象的数组，每个对象包含 dir (中文名) 和 slug (安全名)
      dirs: ${{ steps.scan.outputs.dirs }}
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        # 确保获取完整的历史记录，支持中文文件名
        with:
          fetch-depth: 0

      - name: 2. 扫描并生成 Docker 安全 Slug
        id: scan
        # 核心修改：使用 Bash 脚本循环处理中文目录名，并生成 Base64 编码的安全 Slug
        run: |
          set -euo pipefail
          
          # 1. 查找所有目录名
          DIRS=$(find . -mindepth 1 -maxdepth 1 -type d -exec test -f {}/Dockerfile \; -print | sed 's/\.\///g')
          
          # 2. 初始化 JSON 数组内容
          OUTPUT_JSON_ITEMS=""

          # 3. 循环处理每个目录，生成 Base64 安全 slug
          for DIR in $DIRS; do
            # 使用 Base64 对中文目录名进行编码，保证 ASCII 安全性
            # 转换规则：转小写、替换 '+' 为 '_'、替换 '/' 为 '-'、替换 '=' 为 '.'
            SLUG=$(echo "$DIR" | base64 | tr -d '\n' | tr '[:upper:]' '[:lower:]' | tr '+' '_' | tr '/' '-' | tr '=' '.' | cut -c 1-30)
            
            # 构造 JSON 对象
            ESCAPED_DIR=$(echo "$DIR" | sed 's/"/\\"/g')
            
            OUTPUT_JSON_ITEMS+=",{\"dir\":\"$ESCAPED_DIR\", \"slug\":\"$SLUG\"}"
          done
          
          # 4. 组装最终的紧凑 JSON 数组
          FINAL_JSON="[${OUTPUT_JSON_ITEMS#,}]" # 移除开头的逗号
          
          echo "Generated Matrix JSON (compact format): $FINAL_JSON"
          echo "dirs=$FINAL_JSON" >> $GITHUB_OUTPUT

  # Job 2: 针对每个子目录并行执行构建和推送
  build_multi_image:
    needs: find_dirs
    runs-on: ubuntu-latest
    
    # 关键修改：matrix 现在遍历 dir_data，其中包含中文 dir 和安全 slug
    strategy:
      fail-fast: false # 即使某个镜像构建失败，也继续构建其他镜像
      matrix:
        # matrix.dir_data 包含 { "dir": "中文路径", "slug": "安全标签" }
        dir_data: ${{ fromJson(needs.find_dirs.outputs.dirs) }}

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 启用 Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: 3. 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. 生成镜像标签与元数据
      - name: 4. 提取 Docker 标签和元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 核心修改：使用 matrix.dir_data.slug 作为镜像名称后缀
          # 镜像最终名称示例: ghcr.io/ProbiusOfficial/ctf2awd-yulhhoumen...
          images: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}-${{ matrix.dir_data.slug }}
          tags: |
            # 默认分支自动标记为 latest
            type=raw,value=latest,enable={{is_default_branch}}
            # 分支名称作为标签
            type=ref,event=branch
            # Git 标签（如 v1.0.0）作为标签
            type=ref,event=tag
            # 提交 SHA 值的前 7 位作为标签
            type=sha
            
      # 5. 构建并推送 Docker 镜像
      - name: 5. 构建并推送 Docker 镜像 (${{ matrix.dir_data.dir }})
        uses: docker/build-push-action@v5
        with:
          # 使用中文路径 matrix.dir_data.dir 作为构建上下文 (context)
          context: ${{ matrix.dir_data.dir }}
          # 使用中文路径 matrix.dir_data.dir 明确指定 Dockerfile 路径 (file)
          file: ${{ matrix.dir_data.dir }}/Dockerfile
          # 是否推送：仅在 push 或 tag 事件时推送，PR 跳过
          push: ${{ github.event_name != 'pull_request' }} 
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
