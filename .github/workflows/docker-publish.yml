name: 自动构建并推送 Docker 镜像到 GHCR (多文件夹)

on:
  push:
    # 监测 main 或 master 分支的推送
    branches: ["main", "master"]
    # 监测所有以 'v' 开头的标签（tag）
    tags:
      - "v*"
  # 允许手动从 GitHub 界面触发
  workflow_dispatch:

# 权限配置：读取代码、写入包（GHCR）
permissions:
  contents: read
  packages: write

# 通用环境变量
env:
  REGISTRY: ghcr.io
  # 基础镜像名称，例如 ProbiusOfficial/ctf2awd
  BASE_IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: 发现所有包含 Dockerfile 的子目录
  find_dirs:
    runs-on: ubuntu-latest
    outputs:
      # 将找到的目录列表作为 JSON 传递给下一个 Job
      dirs: ${{ steps.scan.outputs.dirs }}
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        # 确保获取完整的历史记录，支持中文文件名
        with:
          fetch-depth: 0

      - name: 2. 扫描包含 Dockerfile 的子目录
        id: scan
        # 使用 find 命令查找所有包含 Dockerfile 的目录，并将其格式化为 JSON 数组
        # 注意：此处假设 Dockerfile 位于每个级别的第一层子目录中
        run: |
          # 查找所有包含 'Dockerfile' 文件的目录 (使用-mindepth 1 排除仓库根目录)
          # 并使用 jq 转换为 GitHub Actions 期望的 JSON 格式
          DIRS=$(find . -mindepth 1 -maxdepth 1 -type d -exec test -f {}/Dockerfile \; -print | sed 's/\.\///g' | jq -R . | jq -s .)
          echo "Found directories: $DIRS"
          echo "dirs=$DIRS" >> $GITHUB_OUTPUT

  # Job 2: 针对每个子目录并行执行构建和推送
  build_multi_image:
    needs: find_dirs
    runs-on: ubuntu-latest
    
    # 关键：使用 matrix 策略并行运行 Job 1 找到的所有目录
    strategy:
      fail-fast: false # 即使某个镜像构建失败，也继续构建其他镜像
      matrix:
        # matrix.dir 将遍历 find_dirs Job 输出的所有目录名称 (包括中文名)
        dir: ${{ fromJson(needs.find_dirs.outputs.dirs) }}

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 启用 Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: 3. 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. 生成镜像标签与元数据
      - name: 4. 提取 Docker 标签和元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 核心修改：将目录名添加到镜像名称中，确保唯一性
          # 镜像最终名称示例: ghcr.io/ProbiusOfficial/ctf2awd-SQL注入修复
          images: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}-${{ matrix.dir }}
          tags: |
            # 默认分支自动标记为 latest
            type=raw,value=latest,enable={{is_default_branch}}
            # 分支名称作为标签
            type=ref,event=branch
            # Git 标签（如 v1.0.0）作为标签
            type=ref,event=tag
            # 提交 SHA 值的前 7 位作为标签
            type=sha
            
      # 5. 构建并推送 Docker 镜像
      - name: 5. 构建并推送 Docker 镜像 (${{ matrix.dir }})
        uses: docker/build-push-action@v5
        with:
          # 核心修改：将构建上下文设置为当前目录
          context: ${{ matrix.dir }}
          # 核心修改：明确指定 Dockerfile 路径
          file: ${{ matrix.dir }}/Dockerfile
          # 是否推送：仅在 push 或 tag 事件时推送，PR 跳过
          push: ${{ github.event_name != 'pull_request' }} 
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
